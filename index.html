<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090f" />
  <title>Наша история</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="stars" aria-hidden="true"></div>

  <main class="app">
    <section class="intro" id="intro">
      <div class="intro-glow"></div>
      <div class="intro-content">
        <div class="eyebrow">A STORY WRITTEN TOGETHER</div>
        <h1 id="siteTitle">Наша история</h1>
        <p id="siteSubtitle">Каждая точка — воспоминание, которое мы не хотим забыть.</p>
        <button class="primary-btn" id="startButton">
          Начать путешествие
          <span>→</span>
        </button>
      </div>
    </section>

    <section class="map-screen" id="mapScreen" aria-label="Карта нашей истории">
      <header class="topbar">
        <div>
          <div class="mini-label">LOVE MAP</div>
          <h2 id="mapTitle">Наша история</h2>
        </div>

        <div class="relationship-timer" aria-label="Сколько мы вместе">
          <div class="timer-label">МЫ ВМЕСТЕ</div>
          <div class="timer-main">
            <span id="timerYears">0</span><small>лет</small>
            <span id="timerMonths">0</span><small>мес.</small>
            <span id="timerDays">0</span><small>дн.</small>
          </div>
          <div class="timer-sub">
            <span id="timerHours">0</span>ч
            <span id="timerMinutes">0</span>м
            <span id="timerSeconds">0</span>с
          </div>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="resetView" title="Показать всю историю">⌖</button>
          <button class="icon-btn" id="playJourney" title="Пройти историю автоматически">▶</button>
        </div>
      </header>

      <div class="map-viewport" id="mapViewport">
        <div class="map-world" id="mapWorld">
          <svg id="loveMap" class="love-map" viewBox="0 0 1600 1000" role="img" aria-label="Интерактивная линия событий">
            <defs>
              <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="7" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <linearGradient id="routeGradient" x1="0%" x2="100%">
                <stop offset="0%" stop-color="#e6c7ff"/>
                <stop offset="45%" stop-color="#ffb7d7"/>
                <stop offset="100%" stop-color="#f7e7ff"/>
              </linearGradient>

              <radialGradient id="nodeGlow">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
                <stop offset="50%" stop-color="#ffb7d7" stop-opacity=".75"/>
                <stop offset="100%" stop-color="#ffb7d7" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <path id="routeGlow" class="route-glow" d="" />
            <path id="routePath" class="route-path" d="" />
            <g id="eventLayer"></g>
          </svg>
        </div>
      </div>

      <div class="map-hint" id="mapHint">
        <span>Перемещай карту</span>
        <i></i>
        <span>Увеличивай двумя пальцами</span>
         <i></i>
        <span>Люблю тебя Шуничка</span>
      </div>

      <div class="event-panel" id="eventPanel" aria-hidden="true">
        <button class="close-panel" id="closePanel" aria-label="Закрыть">×</button>
        <div class="panel-content">
          <div class="panel-meta" id="panelDate"></div>
          <h3 id="panelTitle"></h3>
          <p id="panelDescription"></p>

          <div class="photo-frame" id="photoFrame" role="button" tabindex="0" aria-label="Открыть фотографию">
            <img id="panelImage" alt="" />
            <div class="photo-placeholder" id="photoPlaceholder">
              <span>♡</span>
              <small>Добавь фотографию в событие</small>
            </div>
            <div class="photo-tap-hint" id="photoTapHint">
              <span class="tap-icon">⌕</span>
              <span>Нажми, чтобы увеличить</span>
            </div>
          </div>

          <div class="panel-counter" id="panelCounter"></div>
        </div>
      </div>

      <div class="journey-progress" id="journeyProgress">
        <div class="progress-track"><span id="progressFill"></span></div>
        <div class="progress-text"><span id="progressCurrent">1</span> / <span id="progressTotal">1</span></div>
      </div>

      <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть фотографию">×</button>
        <div class="lightbox-backdrop" id="lightboxBackdrop"></div>
        <div class="lightbox-content">
          <img id="lightboxImage" alt="" />
          <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
